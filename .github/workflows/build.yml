name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK components
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKM="$p"; break; fi
          done
          if [ -z "$SDKM" ]; then
            SDKM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Prepare project
        working-directory: ./v2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build debug APKs
        working-directory: ./v2rayNG
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Normalize APK names
        working-directory: ./v2rayNG
        run: |
          cd app/build/outputs/apk/debug
          for f in *_null.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f%_null.apk}_universal.apk"
          done
          ls -lh ./*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2ray4oldtv-apk-${{ github.sha }}
          path: v2rayNG/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: v2rayNG/app/build/outputs/apk/debug/*.apk
