<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  body { margin: 0; padding: 20px; background: #101418; color: #ffffff;
         font-family: system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #b0bec5; font-size: 15px; }
  textarea { box-sizing: border-box; width: 100%; min-height: 180px;
             background: #1c2530; color: #ffffff; border: 1px solid #37474f;
             border-radius: 8px; padding: 12px; font-size: 16px; }
  button { margin-top: 14px; width: 100%; min-height: 52px; border: 0;
           border-radius: 8px; background: #1e88e5; color: #ffffff; font-size: 18px; }
  #msg { min-height: 24px; margin-top: 12px; color: #40c4ff; }
</style>
</head>
<body>
<main>
  <h1>__TITLE__</h1>
  <p>__NOTE__</p>
  <textarea id="cfg" placeholder="__PLACEHOLDER__"></textarea>
  <button id="send" type="button">__SUBMIT__</button>
  <p id="msg" role="status"></p>
</main>
<script>
(function () {
  var TOKEN = "__TOKEN__";
  var EMPTY = __EMPTY__;
  var SENDING = __SENDING__;
  var SUCCESS = __SUCCESS__;
  var FAILURE = __FAILURE__;
  var msg = document.getElementById('msg');
  document.getElementById('send').addEventListener('click', function () {
    var text = document.getElementById('cfg').value.trim();
    if (!text) { msg.textContent = EMPTY; return; }
    msg.textContent = SENDING;
    fetch('/import?t=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: text
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        msg.textContent = j.ok ? SUCCESS.replace('{0}', j.count) : FAILURE;
      })
      .catch(function () { msg.textContent = FAILURE; });
  });
})();
</script>
</body>
</html>
